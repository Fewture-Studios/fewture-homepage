<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fewture</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        
        .logo-container {
            text-align: center;
        }
        
        .logo-container img {
            height: 60px;
            width: auto;
            opacity: 0.9;
        }
        
        @media (max-width: 768px) {
            .logo-container img {
                height: 45px;
            }
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="assets/images/Fewture-Studios-Typography.png" alt="Fewture">
    </div>
</body>
</html>
