<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fewture</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #ffffff; 
            color: #000000; 
            font-family: 'Inter', sans-serif; 
        }
        canvas { 
            display: block; 
            position: fixed; 
            top: 0;
            left: 0;
            z-index: 0;
        }

        /* Logo Container Styling */
        #logo-container { 
            position: absolute;
            top: 20px;
            left: 20px;
            width: 150px; 
            height: auto; 
            z-index: 2; 
            background: none; 
            border: none; 
        }

        #logo-container img {
            height: 40px;
            width: auto;
            display: block;
            animation: logoGlow 2s ease-in-out infinite alternate;
        }

        @keyframes logoGlow {
            0% { 
                filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.3));
                transform: scale(1);
            }
            100% { 
                filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.6));
                transform: scale(1.02);
            }
        }

        /* Logo glow effects per mode */
        .dark-mode #logo-container img {
            animation: logoGlowDark 2s ease-in-out infinite alternate;
        }

        @keyframes logoGlowDark {
            0% { 
                filter: invert(1) drop-shadow(0 0 8px rgba(255, 255, 255, 0.4));
                transform: scale(1);
            }
            100% { 
                filter: invert(1) drop-shadow(0 0 20px rgba(255, 255, 255, 0.8));
                transform: scale(1.03);
            }
        }

        .red-mode #logo-container img {
            animation: logoGlowRed 2s ease-in-out infinite alternate;
        }

        @keyframes logoGlowRed {
            0% { 
                filter: hue-rotate(0deg) saturate(2) brightness(0.8) drop-shadow(0 0 8px rgba(255, 0, 0, 0.5));
                transform: scale(1);
            }
            100% { 
                filter: hue-rotate(0deg) saturate(2) brightness(0.8) drop-shadow(0 0 25px rgba(255, 0, 0, 1));
                transform: scale(1.04);
            }
        }

        .green-mode #logo-container img {
            animation: logoGlowGreen 2s ease-in-out infinite alternate;
        }

        @keyframes logoGlowGreen {
            0% { 
                filter: saturate(0.9) brightness(1.0) drop-shadow(0 0 6px rgba(127, 176, 105, 0.4));
                transform: scale(1);
            }
            100% { 
                filter: saturate(0.9) brightness(1.0) drop-shadow(0 0 12px rgba(127, 176, 105, 0.6));
                transform: scale(1.02);
            }
        }
        /* Styling for basic Info Labels */
        .info-label {
            color: #333333; 
            font-family: 'Monospace', monospace; 
            font-size: 10px;
            padding: 2px 4px;
            background-color: rgba(220, 220, 220, 0.7); 
            border: 1px solid rgba(150, 150, 150, 0.5);
            border-radius: 3px;
            white-space: nowrap;
            pointer-events: auto !important; 
            cursor: default; 
        }
       
        /* Container for CSS2D Renderer */
        #css2d-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; 
            pointer-events: none; 
        }

        /* VHS/80s Terminal Style Chat Overlay */
        #chat-container {
            position: fixed;
            bottom: 40px;
            left: 20px;
            width: auto;
            min-width: 350px;
            max-width: 500px;
            height: auto;
            min-height: 300px;
            z-index: 3;
            font-family: 'Courier New', 'Monaco', monospace;
            font-weight: normal;
            pointer-events: auto;
            background: transparent;
            backdrop-filter: none;
            border: none;
            display: flex;
            flex-direction: column;
        }

        #chat-messages {
            height: 200px;
            overflow-y: auto;
            padding: clamp(8px, 2vw, 15px);
            font-family: 'Courier New', 'Monaco', monospace;
            font-size: clamp(12px, 2.5vw, 16px);
            line-height: clamp(1.2, 1.4, 1.6);
            border-bottom: 1px solid var(--border-color, #000000);
        }

        /* VHS scan lines effect */
        #chat-messages::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.05) 2px,
                rgba(0, 0, 0, 0.05) 4px
            );
            pointer-events: none;
            z-index: 1;
        }

        .chat-message {
            font-size: clamp(11px, 2.2vw, 15px);
            line-height: clamp(1.2, 1.4, 1.5);
            margin-bottom: clamp(4px, 1vw, 8px);
            word-wrap: break-word;
            max-width: 100%;
            overflow-wrap: break-word;
            hyphens: auto;
            color: #333333;
            font-family: 'Monospace', monospace;
            padding: 4px 8px;
            background-color: rgba(220, 220, 220, 0.8);
            border: 1px solid rgba(150, 150, 150, 0.6);
            border-radius: 3px;
            position: relative;
            z-index: 2;
            animation: textGlow 0.3s ease-in;
            display: inline-block;
        }

        @keyframes textGlow {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .chat-message.user {
            font-weight: bold;
        }

        .chat-message.user::before {
            content: '> ';
        }

        .chat-message.bot {
            /* Bot message styling inherits from base .chat-message */
        }

        .chat-message.bot::before {
            content: ':: ';
        }

        #chat-input-container {
            display: flex;
            gap: clamp(5px, 1.5vw, 10px);
            padding: 0 clamp(8px, 2vw, 15px);
            align-items: stretch;
        }

        #chat-input {
            flex: 1;
            padding: clamp(8px, 2vw, 12px);
            border: none;
            background: transparent;
            font-family: 'Courier New', 'Monaco', monospace;
            font-size: clamp(12px, 2.5vw, 16px);
            color: var(--text-color, #000000);
            outline: none;
            border-bottom: 1px solid var(--border-color, #000000);
            min-width: 0;
        }

        #chat-input::placeholder {
            color: var(--placeholder-color, rgba(0, 0, 0, 0.6));
        }

        #chat-input:focus {
            border-bottom-color: var(--accent-color, #000000);
        }

        #chat-send {
            padding: clamp(8px, 2vw, 12px) clamp(12px, 3vw, 20px);
            background: transparent;
            color: var(--text-color, #000000);
            border: none;
            border-bottom: 1px solid var(--border-color, #000000);
            font-family: 'Courier New', 'Monaco', monospace;
            font-size: clamp(12px, 2.5vw, 16px);
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }

        #chat-send:hover {
            background: var(--hover-bg, rgba(0, 0, 0, 0.1));
            border-bottom-color: var(--accent-color, #000000);
        }

        /* Light mode (default) */
        :root {
            --text-color: #000000;
            --user-color: #000000;
            --bot-color: #000000;
            --accent-color: #333333;
            --border-color: #000000;
            --placeholder-color: rgba(0, 0, 0, 0.6);
            --hover-bg: rgba(0, 0, 0, 0.1);
        }

        /* Dark mode */
        .dark-mode {
            --text-color: #ffffff;
            --user-color: #ffffff;
            --bot-color: #ffffff;
            --accent-color: #cccccc;
            --border-color: #ffffff;
            --placeholder-color: rgba(255, 255, 255, 0.6);
            --hover-bg: rgba(255, 255, 255, 0.1);
        }

        .dark-mode body {
            background-color: #000000;
            color: #ffffff;
        }

        .dark-mode canvas {
            animation: canvasGlitchDark 3s ease-in-out infinite;
        }

        .dark-mode #logo-container img {
            filter: invert(1);
        }

        @keyframes canvasGlitchDark {
            0%, 90%, 100% { 
                filter: none;
            }
            95% { 
                filter: brightness(1.4) contrast(1.3) hue-rotate(5deg);
                transform: translateX(1px);
            }
        }

        .dark-mode .info-label {
            background-color: rgba(35, 35, 35, 0.7);
            border-color: rgba(105, 105, 105, 0.5);
            color: #cccccc;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .dark-mode .chat-message {
            background-color: rgba(35, 35, 35, 0.8);
            border-color: rgba(105, 105, 105, 0.6);
            color: #cccccc;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .dark-mode #chat-container {
            background: transparent;
            border: none;
        }

        /* Red Willie mode */
        .red-mode {
            --text-color: #ff0000;
            --user-color: #ff0000;
            --bot-color: #ff0000;
            --accent-color: #cc0000;
            --border-color: #ff0000;
            --placeholder-color: rgba(255, 0, 0, 0.6);
            --hover-bg: rgba(255, 0, 0, 0.1);
        }

        /* Green Fund mode */
        .green-mode {
            --text-color: #7fb069;
            --user-color: #7fb069;
            --bot-color: #7fb069;
            --accent-color: #a3c585;
            --border-color: #7fb069;
            --placeholder-color: rgba(127, 176, 105, 0.6);
            --hover-bg: rgba(127, 176, 105, 0.1);
        }

        .red-mode body {
            background-color: #330000;
            color: #ff0000;
        }

        .red-mode canvas {
            filter: hue-rotate(0deg) saturate(1.5) brightness(0.9) contrast(1.1);
            animation: canvasGlitchRed 2.5s ease-in-out infinite;
        }

        .red-mode #logo-container img {
            filter: hue-rotate(0deg) saturate(2) brightness(0.8);
        }

        .green-mode body {
            background-color: #2d3e2d;
            color: #7fb069;
        }

        .green-mode canvas {
            filter: saturate(0.8) brightness(1.1) contrast(0.9);
            animation: none;
        }

        .green-mode #logo-container img {
            filter: saturate(0.9) brightness(1.0);
        }

        @keyframes canvasGlitchRed {
            0%, 85%, 100% { 
                filter: hue-rotate(0deg) saturate(1.5) brightness(0.9) contrast(1.1);
            }
            90% { 
                filter: hue-rotate(10deg) saturate(2) brightness(1.1) contrast(1.3);
                transform: translateX(-1px) skew(0.5deg);
            }
            95% { 
                filter: hue-rotate(-5deg) saturate(1.8) brightness(0.8) contrast(1.2);
                transform: translateX(1px) skew(-0.3deg);
            }
        }

        @keyframes canvasGlitchGreen {
            0%, 88%, 100% { 
                filter: hue-rotate(120deg) saturate(1.5) brightness(0.9) contrast(1.1);
            }
            92% { 
                filter: hue-rotate(130deg) saturate(2.2) brightness(1.2) contrast(1.4);
                transform: translateX(1px) skew(-0.4deg);
            }
            96% { 
                filter: hue-rotate(110deg) saturate(1.8) brightness(0.7) contrast(1.2);
                transform: translateX(-1px) skew(0.2deg);
            }
        }

        .red-mode .info-label {
            background-color: rgba(255, 0, 0, 0.1);
            border-color: rgba(255, 0, 0, 0.7);
            color: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }

        .red-mode .chat-message {
            background-color: rgba(255, 0, 0, 0.15);
            border-color: rgba(255, 0, 0, 0.8);
            color: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }

        .red-mode #chat-container {
            background: transparent;
            border: none;
        }

        .green-mode .info-label {
            background-color: rgba(127, 176, 105, 0.15);
            border-color: rgba(163, 197, 133, 0.6);
            color: #7fb069;
            box-shadow: 0 0 8px rgba(127, 176, 105, 0.3);
        }

        .green-mode .chat-message {
            background-color: rgba(127, 176, 105, 0.2);
            border-color: rgba(163, 197, 133, 0.7);
            color: #7fb069;
            box-shadow: 0 0 8px rgba(127, 176, 105, 0.3);
        }

        .green-mode #chat-container {
            background: transparent;
            border: none;
        }

        /* VHS glitch effect for mode transitions */
        .mode-transition {
            animation: glitchTransition 0.5s ease-in-out;
        }

        @keyframes glitchTransition {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-2px) skew(-1deg); }
            40% { transform: translateX(2px) skew(1deg); }
            60% { transform: translateX(-1px) skew(-0.5deg); }
            80% { transform: translateX(1px) skew(0.5deg); }
        }

        /* Floating status text overlays */
        .status-overlay {
            position: absolute;
            font-family: 'Courier New', 'Monaco', monospace;
            font-size: clamp(8px, 1.8vw, 12px);
            color: var(--text-color, #000000);
            background: rgba(0, 0, 0, 0.1);
            padding: clamp(2px, 0.5vw, 4px) clamp(4px, 1vw, 8px);
            border: 1px solid rgba(0, 0, 0, 0.3);
            z-index: 2;
            pointer-events: none;
            animation: statusFloat 3s ease-in-out infinite;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 30vw;
        }

        @keyframes statusFloat {
            0%, 100% { transform: translateY(0px); opacity: 0.8; }
            50% { transform: translateY(-5px); opacity: 1; }
        }

        .status-overlay.tracking {
            top: 20px;
            right: 20px;
        }

        .status-overlay.analysis {
            top: 60px;
            right: 20px;
        }

        .status-overlay.system {
            bottom: 20px;
            right: 20px;
        }

        /* IRL Video overlay - styled like status overlays */
        .video-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60vw;
            max-width: 800px;
            height: auto;
            z-index: 10;
            display: none;
            border: 2px solid var(--text-color, #000000);
            background: rgba(0, 0, 0, 0.1);
            padding: 8px;
        }

        .video-overlay.active {
            display: block;
            animation: videoFadeIn 0.5s ease-in-out;
        }

        @keyframes videoFadeIn {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        /* Chat repositioning when video content is served */
        #chat-container.video-content-active {
            position: fixed;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 200px;
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .video-overlay video {
            width: 100%;
            height: auto;
            display: block;
        }

        .video-overlay .video-close {
            position: absolute;
            top: clamp(-12px, -2vw, -15px);
            right: clamp(-12px, -2vw, -15px);
            background: var(--text-color, #000000);
            color: var(--bg-color, #ffffff);
            border: none;
            width: clamp(24px, 4vw, 30px);
            height: clamp(24px, 4vw, 30px);
            border-radius: 50%;
            cursor: pointer;
            font-size: clamp(14px, 2.5vw, 18px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 11;
        }

        .video-overlay .video-close:hover {
            background: var(--accent-color, #333333);
        }

        /* Comprehensive Responsive Design with Dynamic Text */
        
        /* Tablet and smaller desktop (768px and below) */
        @media (max-width: 768px) {
            /* Logo scaling */
            #logo-container {
                top: clamp(10px, 2vw, 15px);
                left: clamp(10px, 2vw, 15px);
                width: clamp(100px, 15vw, 120px);
            }
            
            #logo-container img {
                height: clamp(28px, 4vw, 32px);
            }
            
            /* Chat container responsive */
            #chat-container {
                width: clamp(80vw, 85vw, 90vw);
                left: 50%;
                transform: translateX(-50%);
                height: clamp(240px, 35vh, 280px);
                bottom: clamp(8%, 12%, 15%);
            }
            
            #chat-container.video-content-active {
                width: clamp(85vw, 90vw, 95vw);
                height: clamp(160px, 25vh, 180px);
                bottom: clamp(4%, 6%, 8%);
            }
            
            /* Dynamic text condensing */
            .chat-message {
                font-size: clamp(10px, 2vw, 14px);
                line-height: clamp(1.1, 1.3, 1.4);
                margin-bottom: clamp(3px, 0.8vw, 6px);
            }
            
            #chat-input, #chat-send {
                font-size: clamp(11px, 2.2vw, 14px);
                padding: clamp(6px, 1.5vw, 10px);
            }
            
            /* Status overlays scaling */
            .status-overlay {
                font-size: clamp(7px, 1.5vw, 10px);
                padding: clamp(1px, 0.3vw, 3px) clamp(3px, 0.8vw, 6px);
                right: clamp(10px, 2vw, 15px);
                max-width: clamp(25vw, 30vw, 35vw);
            }
            
            .status-overlay.tracking {
                top: clamp(10px, 2vw, 15px);
            }
            
            .status-overlay.analysis {
                top: clamp(35px, 6vw, 45px);
            }
            
            .status-overlay.system {
                bottom: clamp(10px, 2vw, 15px);
            }
            
            /* Video overlay responsive */
            .video-overlay {
                width: clamp(80vw, 85vw, 90vw);
                max-width: 700px;
                top: clamp(25%, 30%, 35%);
                padding: clamp(10px, 2vw, 15px);
            }
        }

        /* Mobile (480px and below) - Ultra Condensed */
        @media (max-width: 480px) {
            /* Logo mobile scaling */
            #logo-container {
                top: clamp(5px, 1.5vw, 10px);
                left: clamp(5px, 1.5vw, 10px);
                width: clamp(80px, 12vw, 100px);
            }
            
            #logo-container img {
                height: clamp(22px, 3.5vw, 28px);
            }
            
            /* Chat mobile layout - ultra condensed */
            #chat-container {
                width: clamp(92vw, 95vw, 98vw);
                height: clamp(200px, 30vh, 240px);
                bottom: clamp(8px, 2vh, 15px);
                left: 50%;
                transform: translateX(-50%);
            }
            
            #chat-container.video-content-active {
                width: clamp(92vw, 95vw, 98vw);
                height: clamp(140px, 20vh, 160px);
                bottom: clamp(4px, 1vh, 8px);
            }
            
            #chat-messages {
                height: clamp(140px, 22vh, 160px);
                font-size: clamp(10px, 2vw, 13px);
                padding: clamp(4px, 1vw, 8px);
                line-height: clamp(1.1, 1.2, 1.3);
            }
            
            .chat-message {
                font-size: clamp(9px, 1.8vw, 12px);
                margin-bottom: clamp(2px, 0.5vw, 4px);
                line-height: clamp(1.0, 1.1, 1.2);
            }
            
            #chat-input {
                font-size: clamp(10px, 2vw, 12px);
                padding: clamp(4px, 1vw, 8px);
            }
            
            #chat-send {
                font-size: clamp(10px, 2vw, 12px);
                padding: clamp(4px, 1vw, 8px) clamp(8px, 2vw, 12px);
            }
            
            /* Status overlays mobile - ultra condensed */
            .status-overlay {
                font-size: clamp(6px, 1.2vw, 8px);
                padding: clamp(1px, 0.2vw, 2px) clamp(2px, 0.5vw, 3px);
                right: clamp(5px, 1.5vw, 10px);
                max-width: clamp(20vw, 25vw, 30vw);
            }
            
            .status-overlay.tracking {
                top: clamp(5px, 1.5vw, 10px);
            }
            
            .status-overlay.analysis {
                top: clamp(25px, 4vw, 35px);
            }
            
            .status-overlay.system {
                bottom: clamp(5px, 1.5vw, 10px);
            }
            
            /* Video overlay mobile - condensed */
            .video-overlay {
                width: clamp(92vw, 95vw, 98vw);
                max-width: none;
                top: clamp(15%, 20%, 25%);
                padding: clamp(6px, 1.5vw, 10px);
            }
        }
        
        /* Large screens (1200px and above) - Enhanced Text */
        @media (min-width: 1200px) {
            #logo-container {
                width: clamp(160px, 12vw, 180px);
            }
            
            #logo-container img {
                height: clamp(40px, 3vw, 45px);
            }
            
            #chat-container {
                width: clamp(420px, 30vw, 450px);
                height: clamp(260px, 20vh, 280px);
            }
            
            #chat-container.video-content-active {
                width: clamp(520px, 35vw, 550px);
                height: clamp(200px, 16vh, 220px);
            }
            
            .chat-message {
                font-size: clamp(14px, 1.1vw, 16px);
                line-height: clamp(1.3, 1.4, 1.5);
            }
            
            #chat-input, #chat-send {
                font-size: clamp(14px, 1.1vw, 16px);
            }
            
            .status-overlay {
                font-size: clamp(11px, 0.9vw, 13px);
                padding: clamp(4px, 0.3vw, 5px) clamp(8px, 0.6vw, 10px);
                max-width: clamp(25vw, 30vw, 35vw);
            }
            
            .video-overlay {
                width: clamp(60vw, 65vw, 70vw);
                max-width: 1000px;
                padding: clamp(20px, 1.5vw, 25px);
            }
        }
        
        /* Ultra-wide screens (1600px and above) - Optimized Text */
        @media (min-width: 1600px) {
            #chat-container {
                width: clamp(480px, 28vw, 500px);
                height: clamp(280px, 18vh, 300px);
            }
            
            #chat-container.video-content-active {
                width: clamp(580px, 32vw, 600px);
                height: clamp(220px, 14vh, 240px);
            }
            
            .chat-message {
                font-size: clamp(15px, 1vw, 17px);
            }
            
            #chat-input, #chat-send {
                font-size: clamp(15px, 1vw, 17px);
            }
            
            .status-overlay {
                font-size: clamp(12px, 0.8vw, 14px);
                max-width: clamp(20vw, 25vw, 30vw);
            }
            
            .video-overlay {
                width: clamp(55vw, 60vw, 65vw);
                max-width: 1200px;
            }
        }

    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Monospace&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@700&display=swap" rel="stylesheet">
    <link href="output.css" rel="stylesheet">
</head>
<body>
    <div id="logo-container"> 
        <img src="assets/images/Fewture-Studios-Typography.png" alt="Fewture Studios Logo">
    </div> 
    <div id="css2d-container"></div>
    
    <!-- VHS Terminal Style Chat Overlay -->
    <div id="chat-container">

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'; 
        // Import GLTFLoader if you plan to load a custom model later
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Core Setup ---
        let scene, camera, renderer, composer, clock, labelRenderer;
        let centralObject, wireframeObject, floorPlane, particlesGrey, debrisGroup; 
        let originalPlaneVertices; 
        const mouse = new THREE.Vector2();
        const targetMouse = new THREE.Vector2();
        
        // Camera zoom state
        let originalCameraPosition = new THREE.Vector3();
        let isZoomedIn = false;
        const ZOOM_DISTANCE = 8;
        const ZOOM_DURATION = 1000; // ms

        // --- Flowing Lines Effect Variables --- 
        let flowLines; 
        let flowLineGeometry;
        let flowLineMaterial;
        const MAX_FLOW_LINES = 10; 
        const LINES_TO_UPDATE_PER_INTERVAL = 2; 
        let lineBufferPointer = 0; 
        const SCAN_RADIUS = 3.0; 
        const DEBRIS_SCAN_RADIUS_FACTOR = 1.2; 
        const NOISE_PATH_RADIUS = 5.0; 
        const NOISE_SPEED_FACTOR = 0.2; 
        let vertexPositions = null; 
        let vertexCount = 0;
        let lastFlowLineUpdateTime = 0;
        const FLOW_LINE_UPDATE_INTERVAL = 0.08; 
        const scanPoint = new THREE.Vector3(); 
        const tempVertex = new THREE.Vector3(); 
        const tempVector = new THREE.Vector3(); 
        const potentialPoints = []; 
        // --- End Flowing Lines Variables ---

        // --- Info Labels ---
        let infoLabelContent = [ // Defined globally so loader can access
            { text: "Object: Custom Mesh", pos: new THREE.Vector3(3.8, 2.0, 0), element: null }, // Added element reference
            { text: "Status: Loading...", pos: new THREE.Vector3(-3.8, 1.0, 0), element: null, isStatus: true } // Added element reference and isStatus flag
        ];
        
        // Store label elements for viewport constraint
        const labelElements = [];

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff); 
            scene.fog = new THREE.FogExp2(0xffffff, 0.035); 

            // Clock
            clock = new THREE.Clock();

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 3, 12); 

            // WebGL Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setClearColor(0xffffff); 
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ACESFilmicToneMapping; 
            renderer.toneMappingExposure = 1.0; 
            document.body.appendChild(renderer.domElement); 

            // CSS2D Renderer
            labelRenderer = new CSS2DRenderer();
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('css2d-container').appendChild(labelRenderer.domElement);

            // --- Lighting ---
            const ambientLight = new THREE.AmbientLight(0xcccccc, 1.0); 
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2); 
            directionalLight.position.set(3, 5, 5); 
            scene.add(directionalLight);
            const hemisphereLight = new THREE.HemisphereLight(0xffffff, 0xaaaaaa, 0.8); 
            scene.add(hemisphereLight);

            // --- Central Object (Torus Knot or Loaded Model) ---
            
            // Option 1: Procedural Torus Knot (Commented out)
            // createTorusKnot(); 
            
            // Option 2: Load external GLB/GLTF model (Uncommented and updated)
            loadExternalModel('assets/models/mesh.glb'); 

            // --- Add Basic Info Labels ---
             // Labels are now attached inside the model loader callback

            // --- Animated Floor Plane --- 
            const planeSize = 60;
            const planeSegments = 60; 
            const planeGeometry = new THREE.PlaneGeometry(planeSize, planeSize, planeSegments, planeSegments);
            originalPlaneVertices = Float32Array.from(planeGeometry.attributes.position.array); 
            const planeMaterial = new THREE.MeshBasicMaterial({ color: 0x444444, wireframe: true, transparent: true, opacity: 0.45 });
            floorPlane = new THREE.Mesh(planeGeometry, planeMaterial);
            floorPlane.rotation.x = -Math.PI / 2; 
            floorPlane.position.y = -2; 
            scene.add(floorPlane);

            // --- Background Effects (Grey Particles) ---
            createParticles(5000, 0xcccccc, 0.1, 0.5, 1); 

            // --- Geometric Debris --- 
            debrisGroup = new THREE.Group();
            const debrisMaterial = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8, metalness: 0.1 });
            const debrisGeometry = new THREE.BoxGeometry(0.1, 0.1, 0.1); 
            const debrisCount = 80; 
            for (let i = 0; i < debrisCount; i++) { 
                const debrisMesh = new THREE.Mesh(debrisGeometry, debrisMaterial);
                const radius = 4 + Math.random() * 2.5; 
                const theta = Math.random() * Math.PI * 2; 
                const phi = Math.acos((Math.random() * 2) - 1); 
                debrisMesh.position.set( radius * Math.sin(phi) * Math.cos(theta), radius * Math.sin(phi) * Math.sin(theta), radius * Math.cos(phi) );
                debrisMesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                debrisMesh.scale.setScalar(Math.random() * 0.6 + 0.4); 
                debrisGroup.add(debrisMesh);
            }
            // Debris position will be set relative to central object after it's created/loaded
            scene.add(debrisGroup);
           
            // --- Flowing Lines Setup (LineSegments) --- 
            flowLineGeometry = new THREE.BufferGeometry();
            const positions = new Float32Array(MAX_FLOW_LINES * 2 * 3); 
            flowLineGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            flowLineMaterial = new THREE.LineBasicMaterial({ 
                color: 0x000000, 
                transparent: false, 
                opacity: 1.0,      
                linewidth: 1 
            });

            flowLines = new THREE.LineSegments(flowLineGeometry, flowLineMaterial); 
            scene.add(flowLines); 
            // --- End Flowing Lines Setup ---

            // --- Post-processing (Subtle Bloom) --- 
            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                0.25, 0.6, 0.95 
            );
            const outputPass = new OutputPass(); 
            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass); 
            composer.addPass(outputPass);
            // --- End Post-processing ---

            // --- Event Listeners ---
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('mousemove', onMouseMove);

            // Update info text/logo container status
            const logoContainer = document.getElementById('logo-container'); 
            if (!logoContainer.querySelector('img')) { 
                 // Fallback if image fails to load or path is wrong
                 logoContainer.textContent = "Animus Scene V5.9 - File Structure";
                 logoContainer.style.border = "1px dashed #888"; // Add border back if image fails
            }
        }
        
        // --- Function to create Torus Knot (Keep for reference, but not called) ---
        function createTorusKnot() {
            const geometry = new THREE.TorusKnotGeometry(2.5, 0.6, 150, 20); 
            vertexPositions = geometry.attributes.position; 
            vertexCount = vertexPositions.count;

            const solidMaterial = new THREE.MeshStandardMaterial({
                color: 0x222222, emissive: 0x000000, metalness: 0.1, roughness: 0.6,
            });
            centralObject = new THREE.Mesh(geometry, solidMaterial);
            centralObject.position.y = 2; 
            scene.add(centralObject);

            const wireframeMaterial = new THREE.MeshBasicMaterial({
                color: 0xffffff, wireframe: true, transparent: true, opacity: 0.4 
            });
            wireframeObject = new THREE.Mesh(geometry, wireframeMaterial);
            wireframeObject.scale.setScalar(1.001); 
            centralObject.add(wireframeObject); 

            // Attach labels and position debris relative to the created object
            attachInfoLabels(centralObject);
            positionDebris();
        }

        // --- Function to Load External Model ---
        function loadExternalModel(modelPath) {
            const loader = new GLTFLoader();
            loader.load(
                modelPath,
                function (gltf) { // Success callback
                centralObject = gltf.scene;
                
                    // --- Center and Scale Loaded Model --- START ---
                    const box = new THREE.Box3().setFromObject(centralObject);
                    const size = box.getSize(new THREE.Vector3());
                    const center = box.getCenter(new THREE.Vector3());

                    const maxSize = Math.max(size.x, size.y, size.z);
                    const desiredSize = 4.0; // Target size for the largest dimension
                    const scale = desiredSize / maxSize;

                    console.log(`Original model size: x=${size.x.toFixed(2)}, y=${size.y.toFixed(2)}, z=${size.z.toFixed(2)}`);
                    console.log(`Calculated scale: ${scale.toFixed(2)}`);

                    centralObject.scale.multiplyScalar(scale);
                    centralObject.position.sub(center.multiplyScalar(scale)); // Center after scaling
                    // Optional: Adjust final position slightly if needed
                    // centralObject.position.y += 1.0; 
                    // --- Center and Scale Loaded Model --- END ---

                    scene.add(centralObject);

                    // Update wireframe reference if needed (might need adjustment based on model structure)
                    const wireframeMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.2 });
                centralObject.traverse((child) => {
                    if (child.isMesh) {
                             wireframeObject = new THREE.Mesh(child.geometry, wireframeMaterial);
                             wireframeObject.position.copy(child.position);
                             wireframeObject.rotation.copy(child.rotation);
                             wireframeObject.scale.copy(child.scale);
                             // Don't add wireframe to scene directly, just keep reference or add conditionally
                         }
                     });

                    // Update debris position relative to loaded model (optional)
                    if (debrisGroup && centralObject) {
                         debrisGroup.position.copy(centralObject.position);
                    }

                    // Update status label and attach all labels
                    const statusLabelData = infoLabelContent.find(l => l.text.startsWith("Status:"));
                    if (statusLabelData) statusLabelData.text = "Status: Stable";
                    attachInfoLabels(centralObject); 

                    console.log('Model loaded successfully.');
                     // Trigger initial animation updates if needed
                     lastFlowLineUpdateTime = clock.getElapsedTime(); // Reset timer if flow lines depend on model
                     // updateFlowLines(); // Generate initial lines based on loaded model - COMMENTED OUT
                },
                undefined, // Progress callback (optional)
                function (error) { // Error callback
                    console.error('An error happened loading the model:', error);
                     const statusLabelData = infoLabelContent.find(l => l.text.startsWith("Status:"));
                    if (statusLabelData) statusLabelData.text = "Status: Error Loading";
                    // Maybe create a fallback object?
                    // createTorusKnot(); // Or create the fallback torus knot
                }
            );
        }

        // --- Function to Attach CSS2D Info Labels ---
        function attachInfoLabels(targetObject) {
             if (!targetObject) return;
             // Clear existing labels first? Optional, depends on desired behavior.
             // targetObject.children.filter(child => child.isCSS2DObject).forEach(label => targetObject.remove(label));

             infoLabelContent.forEach(info => { 
                 const labelDiv = document.createElement('div');
                 labelDiv.className = 'info-label'; 
                 labelDiv.textContent = info.text; 
                 const label = new CSS2DObject(labelDiv);
                 label.position.copy(info.pos);
                 info.element = label; // Store reference to the label object
                 targetObject.add(label);
                 
                 // Store status label for viewport constraint
                 if (info.isStatus) {
                     labelElements.push({
                         element: labelDiv,
                         offset: new THREE.Vector3().copy(info.pos),
                         isStatus: true
                     });
                 }
             });
        }
        
        // --- Function to position debris ---
        function positionDebris() {
             if (debrisGroup && centralObject) {
                 debrisGroup.position.copy(centralObject.position);
             }
        }

        // --- Helper Function for Particles ---
        function createParticles(count, baseColorHex, size, opacity, speedFactor) { /* ... (no changes) ... */ 
             const particlePositions = new Float32Array(count * 3);
             const particleColors = new Float32Array(count * 3);
             const baseColor = new THREE.Color(baseColorHex);
             const particleVelocities = new Float32Array(count * 3); 
             for (let i = 0; i < count; i++) {
                 const i3 = i * 3;
                 particlePositions[i3] = (Math.random() - 0.5) * 90; 
                 particlePositions[i3 + 1] = (Math.random() - 0.5) * 60;
                 particlePositions[i3 + 2] = (Math.random() - 0.5) * 90;
                 const colorVariance = (Math.random() - 0.5) * 0.1;
                 const particleColor = baseColor.clone().offsetHSL(0, 0, colorVariance);
                 particleColors[i3] = particleColor.r; particleColors[i3 + 1] = particleColor.g; particleColors[i3 + 2] = particleColor.b;
                 particleVelocities[i3] = (Math.random() - 0.5) * 0.01 * speedFactor;
                 particleVelocities[i3 + 1] = (Math.random() - 0.5) * 0.01 * speedFactor;
                 particleVelocities[i3 + 2] = (Math.random() - 0.5) * 0.01 * speedFactor;
             }
             const geometry = new THREE.BufferGeometry();
             geometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
             geometry.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));
             geometry.setAttribute('velocity', new THREE.BufferAttribute(particleVelocities, 3)); 
             const material = new THREE.PointsMaterial({ size: size, vertexColors: true, sizeAttenuation: true, transparent: true, opacity: opacity, blending: THREE.NormalBlending, depthWrite: false });
             const points = new THREE.Points(geometry, material);
             points.userData.speedFactor = speedFactor; 
             scene.add(points);
             particlesGrey = points; 
        }

        // --- Event Handlers ---
        function onWindowResize() { 
            const width = window.innerWidth; const height = window.innerHeight;
            camera.aspect = width / height; camera.updateProjectionMatrix();
            renderer.setSize(width, height); composer.setSize(width, height); 
            labelRenderer.setSize(width, height); 
            // Update bloom pass resolution if needed (though less critical)
            // composer.passes.forEach(pass => {
            //     if (pass.setSize) pass.setSize(width, height);
            // });
        }
        function onMouseMove(event) { /* ... (no changes) ... */ 
             targetMouse.x = (event.clientX / window.innerWidth) * 2 - 1;
             targetMouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        // --- Animation Loop ---
        // Function to keep labels within viewport and visible
        function updateLabelPositions() {
            if (!camera) return;
            
            // Get camera's viewport dimensions
            const vFOV = THREE.MathUtils.degToRad(camera.fov);
            const height = 2 * Math.tan(vFOV / 2) * Math.abs(camera.position.z);
            const width = height * camera.aspect;
            
            // Buffer to keep labels from touching screen edges (20% buffer)
            const edgeBuffer = 0.2;
            const xBound = (width / 2) * (1 - edgeBuffer);
            const yBound = (height / 2) * (1 - edgeBuffer);
            
            labelElements.forEach(({ element, offset, isStatus }) => {
                if (!element || !element.position) return;
                
                if (isStatus) {
                    // Get the world position of the label
                    const worldPosition = element.getWorldPosition(new THREE.Vector3());
                    
                    // Convert 3D position to 2D screen space
                    const screenPosition = worldPosition.clone().project(camera);
                    
                    // Convert from NDC to screen space
                    const x = (screenPosition.x * 0.5 + 0.5) * window.innerWidth;
                    const y = (-(screenPosition.y * 0.5) + 0.5) * window.innerHeight;
                    
                    // Check if the label is outside the viewport
                    const margin = 50; // pixels from edge
                    const leftEdge = margin;
                    const rightEdge = window.innerWidth - margin;
                    const topEdge = margin;
                    const bottomEdge = window.innerHeight - margin;
                    
                    // If label is outside viewport, adjust its position
                    if (x < leftEdge || x > rightEdge || y < topEdge || y > bottomEdge) {
                        // Calculate new position at the edge of the viewport
                        const newX = Math.max(leftEdge, Math.min(rightEdge, x));
                        const newY = Math.max(topEdge, Math.min(bottomEdge, y));
                        
                        // Convert back to 3D space
                        const xNDC = (newX / window.innerWidth) * 2 - 1;
                        const yNDC = -((newY / window.innerHeight) * 2 - 1);
                        
                        // Calculate position in world space
                        const vector = new THREE.Vector3(xNDC, yNDC, 0.9); // 0.9 = slightly in front of scene
                        vector.unproject(camera);
                        
                        // Update label position with smoothing
                        element.position.lerp(
                            element.parent.worldToLocal(vector),
                            0.1
                        );
                    }
                    
                    // Force the label to always be on top
                    if (element.element) {
                        element.element.style.zIndex = '1000';
                        element.element.style.pointerEvents = 'auto';
                    }
                }
            });
        }
        
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();
            
            // Update label positions and visibility
            updateLabelPositions();
            
            // Ensure status label is always on top and visible
            labelElements.forEach(({ element, isStatus }) => {
                if (isStatus && element && element.element) {
                    element.element.style.zIndex = '1000';
                    element.element.style.pointerEvents = 'auto';
                    // Force the label to be on top of 3D objects
                    element.renderOrder = 999;
                }
            });

            // --- Normal Parallax Mouse Movement ---
            mouse.x += (targetMouse.x - mouse.x) * 0.05;
            mouse.y += (targetMouse.y - mouse.y) * 0.05;
            // Only update lookAt if centralObject exists
            if (centralObject) {
                const targetLookAt = new THREE.Vector3( mouse.x * 0.5, centralObject.position.y + mouse.y * 0.5, 0 ); 
                const currentLookAt = new THREE.Vector3();
                camera.getWorldDirection(currentLookAt); 
                currentLookAt.multiplyScalar(10).add(camera.position); 
                currentLookAt.lerp(targetLookAt, 0.05); 
                camera.lookAt(currentLookAt);
            }
            camera.position.set(0, 5, 15);
            camera.lookAt(0, 0, 0);
            
            // Store original camera position
            originalCameraPosition.copy(camera.position);

            // --- Object Animation ---
            if (centralObject) { 
                centralObject.rotation.x = Math.sin(elapsedTime * 0.1) * 0.1 + mouse.y * 0.15; 
                centralObject.rotation.y = elapsedTime * 0.15 + mouse.x * 0.15;
                centralObject.rotation.z += 0.0005; 
                
                // Pulse the wireframe scale using simulated noise 
                if (wireframeObject) { // Check if wireframe exists (relevant if loading models)
                    const noiseTime = elapsedTime * 0.4; 
                    const scaleNoise = 0.5 + 0.2 * Math.sin(noiseTime * 0.7) + 0.15 * Math.cos(noiseTime * 1.1) + 0.1 * Math.sin(noiseTime * 2.3); 
                    const scalePulse = 1.001 + scaleNoise * 0.004; 
                    wireframeObject.scale.setScalar(scalePulse);
                }

                centralObject.updateMatrixWorld(); 
            }
            
            // --- Particle Animation ---
            if (particlesGrey) { /* ... (no changes) ... */ 
                const positions = particlesGrey.geometry.attributes.position.array;
                const velocities = particlesGrey.geometry.attributes.velocity.array;
                for (let i = 0; i < positions.length; i+=3) {
                    positions[i] += velocities[i] * delta * 60; positions[i+1] += velocities[i+1] * delta * 60; positions[i+2] += velocities[i+2] * delta * 60;
                    if (Math.abs(positions[i]) > 45) velocities[i] *= -1; if (Math.abs(positions[i+1]) > 30) velocities[i+1] *= -1; if (Math.abs(positions[i+2]) > 45) velocities[i+2] *= -1;
                }
                particlesGrey.geometry.attributes.position.needsUpdate = true;
                particlesGrey.rotation.y += 0.005 * delta * (particlesGrey.userData.speedFactor || 1);
            }

            // --- Floor Displacement Animation --- 
            if (floorPlane && originalPlaneVertices) { 
                const positions = floorPlane.geometry.attributes.position.array;
                const noiseFrequency = 0.15; 
                const noiseAmplitude = 0.8; 
                const timeFactor = elapsedTime * 0.8; 
                for (let i = 0; i < positions.length; i += 3) {
                    const originalX = originalPlaneVertices[i]; const originalZ = originalPlaneVertices[i+2]; 
                    const displacement = (Math.sin(originalX * noiseFrequency + timeFactor) + Math.cos(originalZ * noiseFrequency * 0.8 - timeFactor * 0.6)) * noiseAmplitude * 0.7; 
                    positions[i + 1] = originalPlaneVertices[i + 1] + displacement; 
                }
                floorPlane.geometry.attributes.position.needsUpdate = true; 
            }

            // --- Debris Animation --- 
            if (debrisGroup) {
                debrisGroup.rotation.y += 0.08 * delta; 
                debrisGroup.rotation.x += 0.03 * delta; 
            }
           
            // --- Flowing Lines Update (Gradual Replacement) --- 
            // 1. Update Scan Point Position using simulated noise
            if (centralObject) { // Only update if central object exists
                const time = elapsedTime * NOISE_SPEED_FACTOR;
                scanPoint.set(
                    Math.sin(time * 0.7) * Math.cos(time * 0.5) * NOISE_PATH_RADIUS,
                    Math.sin(time * 0.4) * NOISE_PATH_RADIUS * 0.4, 
                    Math.cos(time * 0.3) * Math.sin(time * 0.6) * NOISE_PATH_RADIUS
                );
                scanPoint.add(centralObject.position); 
            }

            // 2. Find Nearby Vertices & Debris, Update Lines (less frequently)
            if (centralObject && vertexPositions && debrisGroup && flowLines && elapsedTime > lastFlowLineUpdateTime + FLOW_LINE_UPDATE_INTERVAL) { 
                lastFlowLineUpdateTime = elapsedTime;
                
                potentialPoints.length = 0; 

                // Find nearby vertices
                for (let i = 0; i < vertexCount; i++) {
                    tempVertex.fromBufferAttribute(vertexPositions, i);
                    tempVertex.applyMatrix4(centralObject.matrixWorld); 
                    if (tempVertex.distanceToSquared(scanPoint) < SCAN_RADIUS * SCAN_RADIUS) { 
                        potentialPoints.push(tempVertex.clone()); 
                    }
                }

                // Find nearby debris
                const debrisScanRadiusSq = SCAN_RADIUS * DEBRIS_SCAN_RADIUS_FACTOR * SCAN_RADIUS * DEBRIS_SCAN_RADIUS_FACTOR;
                debrisGroup.children.forEach(debrisMesh => {
                    debrisMesh.getWorldPosition(tempVector); 
                    if (tempVector.distanceToSquared(scanPoint) < debrisScanRadiusSq) {
                        potentialPoints.push(tempVector.clone());
                    }
                });

                // 3. Update a *subset* of Line Geometry Positions
                const linePositions = flowLineGeometry.attributes.position.array;
                let bufferNeedsUpdate = false; 

                if (potentialPoints.length > 1) {
                    for (let i = 0; i < LINES_TO_UPDATE_PER_INTERVAL; i++) { 
                        if (potentialPoints.length < 2) break; 
                        
                        const index1 = Math.floor(Math.random() * potentialPoints.length);
                        let index2 = Math.floor(Math.random() * potentialPoints.length);
                        while (index2 === index1) { 
                            index2 = Math.floor(Math.random() * potentialPoints.length); 
                        }
                        const v1 = potentialPoints[index1]; 
                        const v2 = potentialPoints[index2];
                        
                        const bufferIndex = lineBufferPointer * 6; 
                        linePositions[bufferIndex + 0] = v1.x; linePositions[bufferIndex + 1] = v1.y; linePositions[bufferIndex + 2] = v1.z;
                        linePositions[bufferIndex + 3] = v2.x; linePositions[bufferIndex + 4] = v2.y; linePositions[bufferIndex + 5] = v2.z;

                        lineBufferPointer = (lineBufferPointer + 1) % MAX_FLOW_LINES; 
                        bufferNeedsUpdate = true;
                    }
                }
                
                if (bufferNeedsUpdate) {
                     flowLineGeometry.attributes.position.needsUpdate = true;
                }
            }
            // --- End Flowing Lines Update ---

            // --- Rendering ---
            composer.render(delta); 
            labelRenderer.render(scene, camera); 
        }

        // --- Chat Functionality ---
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const chatSend = document.getElementById('chat-send');

        // API endpoint - Live AWS API Gateway URL
        const API_ENDPOINT = 'https://dbodwffja7.execute-api.us-east-1.amazonaws.com/prod/chat';

        function addMessage(message, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${isUser ? 'user' : 'bot'}`;
            messageDiv.textContent = message;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // IRL Video functions
        function showIRLVideo() {
            const overlay = document.getElementById('irl-video-overlay');
            const video = document.getElementById('irl-video-player');
            const chatContainer = document.getElementById('chat-container');
            
            overlay.classList.add('active');
            video.currentTime = 0;
            video.play();
            
            // Move chat underneath video when content is served
            chatContainer.classList.add('video-content-active');
            
            // Zoom camera closer to 3D object
            zoomCameraToObject();
        }
        
        function closeIRLVideo() {
            const overlay = document.getElementById('irl-video-overlay');
            const video = document.getElementById('irl-video-player');
            const chatContainer = document.getElementById('chat-container');
            
            video.pause();
            video.currentTime = 0;
            overlay.classList.remove('active');
            
            // Return chat to default position
            chatContainer.classList.remove('video-content-active');
            
            // Zoom camera back out
            zoomCameraOut();
        }
        
        function zoomCameraToObject() {
            if (isZoomedIn) return;
            
            isZoomedIn = true;
            const startPos = camera.position.clone();
            const targetPos = new THREE.Vector3(0, 2, ZOOM_DISTANCE);
            const startTime = Date.now();
            
            function animateZoom() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / ZOOM_DURATION, 1);
                const eased = 1 - Math.pow(1 - progress, 3); // ease-out cubic
                
                camera.position.lerpVectors(startPos, targetPos, eased);
                camera.lookAt(0, 0, 0);
                
                if (progress < 1) {
                    requestAnimationFrame(animateZoom);
                }
            }
            
            animateZoom();
        }
        
        function zoomCameraOut() {
            if (!isZoomedIn) return;
            
            isZoomedIn = false;
            const startPos = camera.position.clone();
            const targetPos = originalCameraPosition.clone();
            const startTime = Date.now();
            
            function animateZoom() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / ZOOM_DURATION, 1);
                const eased = 1 - Math.pow(1 - progress, 3); // ease-out cubic
                
                camera.position.lerpVectors(startPos, targetPos, eased);
                camera.lookAt(0, 0, 0);
                
                if (progress < 1) {
                    requestAnimationFrame(animateZoom);
                }
            }
            
            animateZoom();
        }

        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;

            // Check for theme triggers
            if (checkForFewtureKeywords(message) && currentMode !== 'light') {
                switchMode('light');
            } else if (checkForIRLKeywords(message) && currentMode !== 'dark') {
                switchMode('dark');
                // Auto-show IRL teaser video when switching to IRL mode
                setTimeout(() => {
                    showIRLVideo();
                }, 500);
            } else if (checkForWillieKeywords(message) && currentMode !== 'red') {
                switchMode('red');
            } else if (checkForFundKeywords(message) && currentMode !== 'green') {
                switchMode('green');
            }
            
            // Check for specific IRL video requests
            if (message.toLowerCase().includes('irl teaser') || 
                message.toLowerCase().includes('teaser') || 
                message.toLowerCase().includes('video')) {
                showIRLVideo();
            }

            // Add user message to chat
            addMessage(message, true);
            chatInput.value = '';

            // Show typing indicator
            addMessage('Thinking...');

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                
                // Remove typing indicator
                chatMessages.removeChild(chatMessages.lastChild);
                
                // Add bot response
                addMessage(data.reply);

                // Handle any 3D scene actions
                if (data.action) {
                    handleSceneAction(data.action);
                }

            } catch (error) {
                // Remove typing indicator
                chatMessages.removeChild(chatMessages.lastChild);
                addMessage('Sorry, I encountered an error. Please try again.');
                console.error('Chat error:', error);
            }
        }

        // Theme management
        let currentMode = 'light'; // 'light', 'dark', 'red'

        function switchMode(mode) {
            const body = document.body;
            
            // Remove all mode classes
            body.classList.remove('dark-mode', 'red-mode', 'green-mode', 'mode-transition');
            
            // Update Three.js renderer background color and 3D object styling
            if (mode === 'dark') {
                body.classList.add('dark-mode');
                currentMode = 'dark';
                renderer.setClearColor(0x000000); // Black background
                scene.background = new THREE.Color(0x000000);
                scene.fog = new THREE.FogExp2(0x000000, 0.035);
                update3DObjectStyling('dark');
            } else if (mode === 'red') {
                body.classList.add('red-mode');
                currentMode = 'red';
                renderer.setClearColor(0x330000); // Dark red background
                scene.background = new THREE.Color(0x330000);
                scene.fog = new THREE.FogExp2(0x330000, 0.035);
                update3DObjectStyling('red');
            } else if (mode === 'green') {
                body.classList.add('green-mode');
                currentMode = 'green';
                renderer.setClearColor(0x2d3e2d); // Muted sage green background
                scene.background = new THREE.Color(0x2d3e2d);
                scene.fog = new THREE.FogExp2(0x2d3e2d, 0.025);
                update3DObjectStyling('green');
            } else {
                currentMode = 'light';
                renderer.setClearColor(0xffffff); // White background
                scene.background = new THREE.Color(0xffffff);
                scene.fog = new THREE.FogExp2(0xffffff, 0.035);
                update3DObjectStyling('light');
            }
            
            body.classList.add('mode-transition');
            
            // Update status overlays
            updateStatusOverlays();
            
            // Remove transition class after animation
            setTimeout(() => {
                body.classList.remove('mode-transition');
            }, 500);
        }

        function updateStatusOverlays() {
            const trackingEl = document.querySelector('.status-overlay.tracking');
            const analysisEl = document.querySelector('.status-overlay.analysis');
            const systemEl = document.querySelector('.status-overlay.system');
            
            if (currentMode === 'dark') {
                trackingEl.textContent = 'IRL MODE: ACTIVE';
                analysisEl.textContent = 'NIGHT VISION: ON';
                systemEl.textContent = 'STEALTH: ENABLED';
            } else if (currentMode === 'red') {
                trackingEl.textContent = 'WILLIE MODE: ACTIVE';
                analysisEl.textContent = 'DANGER: HIGH';
                systemEl.textContent = 'ALERT: CRITICAL';
            } else if (currentMode === 'green') {
                trackingEl.textContent = 'FUND MODE: ACTIVE';
                analysisEl.textContent = 'PORTFOLIO: TRACKING';
                systemEl.textContent = 'INVESTMENT: READY';
            } else {
                trackingEl.textContent = 'TRACKING: ACTIVE';
                analysisEl.textContent = 'ANALYSIS: RUNNING';
                systemEl.textContent = 'SYSTEM: ONLINE';
            }
        }

        function checkForIRLKeywords(message) {
            const irlKeywords = ['irl', 'internet racing league', 'racing', 'league'];
            const lowerMessage = message.toLowerCase();
            
            return irlKeywords.some(keyword => lowerMessage.includes(keyword));
        }

        function checkForWillieKeywords(message) {
            const willieKeywords = ['steamboat willie', 'willie', 'steamboat', 'mickey', 'disney'];
            const lowerMessage = message.toLowerCase();
            
            return willieKeywords.some(keyword => lowerMessage.includes(keyword));
        }

        function checkForFewtureKeywords(message) {
            const fewtureKeywords = ['fewture', 'fewture co', 'fewture studios', 'normal', 'default', 'reset'];
            const lowerMessage = message.toLowerCase();
            
            return fewtureKeywords.some(keyword => lowerMessage.includes(keyword));
        }

        function checkForFundKeywords(message) {
            const fundKeywords = ['fewture fund', 'fund', 'investment', 'portfolio', 'invest', 'capital', 'venture'];
            const lowerMessage = message.toLowerCase();
            
            return fundKeywords.some(keyword => lowerMessage.includes(keyword));
        }

        function update3DObjectStyling(mode) {
            if (!centralObject) return;

            // Remove existing wireframe if present
            if (wireframeObject && wireframeObject.parent) {
                wireframeObject.parent.remove(wireframeObject);
            }

            centralObject.traverse((child) => {
                if (child.isMesh) {
                    const originalMaterial = child.material;
                    
                    if (mode === 'green') {
                        // Fund mode: Professional wireframe
                        const wireframeMaterial = new THREE.MeshBasicMaterial({ 
                            color: 0x7fb069, 
                            wireframe: true, 
                            transparent: true, 
                            opacity: 0.8 
                        });
                        child.material = wireframeMaterial;
                        
                    } else if (mode === 'red') {
                        // Willie mode: Glitchy, distorted solid
                        const redMaterial = new THREE.MeshStandardMaterial({
                            color: 0xff0000,
                            emissive: 0x330000,
                            metalness: 0.8,
                            roughness: 0.2,
                            transparent: true,
                            opacity: 0.9
                        });
                        child.material = redMaterial;
                        
                    } else if (mode === 'dark') {
                        // IRL mode: Pure black high-tech
                        const darkMaterial = new THREE.MeshStandardMaterial({
                            color: 0x000000,
                            emissive: 0x000000,
                            metalness: 0.9,
                            roughness: 0.1,
                            transparent: true,
                            opacity: 0.95
                        });
                        child.material = darkMaterial;
                        
                    } else {
                        // Light mode: Clean standard material
                        const lightMaterial = new THREE.MeshStandardMaterial({
                            color: 0x666666,
                            metalness: 0.3,
                            roughness: 0.7
                        });
                        child.material = lightMaterial;
                    }
                }
            });
        }

        function handleSceneAction(action) {
            // Handle different actions from the chatbot
            switch(action) {
                case 'highlight_model':
                    // Add glow or highlight effect to the central object
                    if (centralObject) {
                        // Example: change material color temporarily
                        console.log('Highlighting model...');
                    }
                    break;
                case 'rotate_camera':
                    // Rotate camera around the scene
                    console.log('Rotating camera...');
                    break;
                case 'dark_mode':
                    if (currentMode !== 'dark') {
                        switchMode('dark');
                    }
                    break;
                case 'red_mode':
                    if (currentMode !== 'red') {
                        switchMode('red');
                    }
                    break;
                default:
                    console.log('Unknown action:', action);
            }
        }

        // Event listeners
        chatSend.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // --- Start ---
        init();
        animate();

    </script>
</body>
</html>
